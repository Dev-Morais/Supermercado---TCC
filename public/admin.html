<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0f9d6b"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="css/app.css"><title>Painel · SuperExpress</title></head>
<body data-private>
<header class="top"><div class="wrap top-in">
  <a class="logo" href="/"><span class="logo-mark"><i class="fa-solid fa-basket-shopping"></i></span>SuperExpress <span class="badge-admin">ADMIN</span></a>
  <nav class="top-actions"><a class="btn soft" href="/"><i class="fa-solid fa-arrow-left"></i><span>Ver loja</span></a><a class="btn ghost" href="profile.html"><i class="fa-regular fa-user"></i><span>Perfil</span></a></nav>
</div></header>
<main class="wrap" style="padding-bottom:60px">
  <div class="alert" id="avisoSenha" hidden style="margin-top:20px">⚠️ Você ainda está usando a senha padrão (123456). <a href="profile.html" style="text-decoration:underline">Troque agora em Perfil → Alterar senha</a>.</div>
  <div class="stats" id="stats"></div>
  <div class="tabs"><button class="chip on" data-tab="produtos"><i class="fa-solid fa-boxes-stacked"></i>Produtos e estoque</button><button class="chip" data-tab="usuarios"><i class="fa-solid fa-users"></i>Contas</button><button class="chip" data-tab="feedback"><i class="fa-regular fa-comment-dots"></i>Feedback<span class="mini-badge" id="fbBadge" hidden></span></button></div>

  <section id="aba-produtos">
    <details class="p-card" style="margin-bottom:16px"><summary style="cursor:pointer;font-weight:700"><i class="fa-solid fa-plus"></i> Novo produto</summary>
      <form id="novoForm" style="margin-top:16px"><div class="novo">
        <div class="field"><label>Nome *</label><input class="f-input" name="base" placeholder="Leite" required></div>
        <div class="field"><label>Tipo</label><input class="f-input" name="variante" placeholder="Integral"></div>
        <div class="field"><label>Marca</label><input class="f-input" name="marca" placeholder="Italac"></div>
        <div class="field"><label>Tamanho</label><input class="f-input" name="tamanho" placeholder="1L, 500g, 1kg"></div>
        <div class="field"><label>Categoria *</label><select class="f-input" name="categoria"><option value="hortifruti">Hortifrúti</option><option value="padaria">Padaria</option><option value="carnes">Carnes</option><option value="laticinios">Laticínios</option><option value="bebidas">Bebidas</option><option value="mercearia">Mercearia</option></select></div>
        <div class="field"><label>Preço *</label><input class="f-input" name="preco" type="number" step="0.01" min="0.01" required></div>
        <div class="field"><label>Preço antigo</label><input class="f-input" name="precoAntigo" type="number" step="0.01" min="0"></div>
        <div class="field"><label>Estoque *</label><input class="f-input" name="estoque" type="number" min="0" step="any" value="10" required></div>
        <div class="field"><label>Ícone (emoji)</label><input class="f-input" name="icone" placeholder="🥛"></div>
        <div class="field"><label><input type="checkbox" name="granel"> Vendido por kg</label></div>
      </div><button class="btn pri" type="submit">Cadastrar produto</button></form>
    </details>
    <div class="tbar"><input class="f-input" id="busca" placeholder="Buscar produto..." type="search">
      <select class="f-input" id="filtro"><option value="todos">Todos</option><option value="esgotados">Esgotados</option><option value="baixo">Estoque baixo (≤5)</option></select><span class="mu" id="qtd" style="color:var(--muted)"></span></div>
    <div class="tbl-wrap" style="max-height:70vh"><table class="tbl"><thead><tr><th>Produto</th><th>Preço (R$)</th><th>Estoque</th><th></th></tr></thead><tbody id="tbProdutos"></tbody></table></div>
  </section>

  <section id="aba-usuarios" hidden>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Nome</th><th>E-mail</th><th>Papel</th><th>Desde</th><th></th></tr></thead><tbody id="tbUsuarios"></tbody></table></div>
  </section>

  <section id="aba-feedback" hidden>
    <div class="tbar"><select class="f-input" id="fbStatus"><option value="">Todos os status</option><option value="novo">Novos</option><option value="lido">Em análise</option><option value="resolvido">Respondidos</option></select>
      <select class="f-input" id="fbTipo"><option value="">Todos os tipos</option><option value="elogio">👍 Elogios</option><option value="sugestao">💡 Sugestões</option><option value="problema">⚠️ Problemas</option><option value="duvida">❓ Dúvidas</option></select>
      <span id="fbResumo" style="color:var(--muted)"></span></div>
    <div id="listaFb"></div>
  </section>
</main>
<div id="toasts"></div>
<script src="js/auth.js"></script><script src="js/admin.js"></script>
</body></html>
